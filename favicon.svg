      <stop offset="0%" stop-color="#F97316"/> <!-- Orange -->
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
