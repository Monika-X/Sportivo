<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportivo - 404</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/status.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="status-body">
    <nav class="navbar" style="position: absolute; top: 0; left: 0; width: 100%;">
        <a href="../index.html" class="logo">Sportivo</a>
        <div class="nav-icons">
            <div class="user-dropdown">
                <button id="user-toggle" aria-label="User Profile" title="Account"><i class="fas fa-user"></i></button>
                <div class="user-dropdown-menu" id="user-dropdown-menu">
                    <a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a>
                    <a href="signup.html"><i class="fas fa-user-plus"></i> Sign Up</a>
                </div>
            </div>
            <button id="theme-toggle" aria-label="Toggle Theme" title="Toggle Theme"><i class="fas fa-moon"></i></button>
            <button id="rtl-toggle" aria-label="Toggle RTL" title="Toggle RTL" style="font-weight: 700; font-size: 0.9rem;">RTL</button>
        </div>
    </nav>
    <div class="status-container text-center">
        <img src="https://illustrations.popsy.co/amber/falling.svg" alt="404 Illustration" class="status-img">
        <h1 class="error-code">404</h1>
        <h2>Out of Bounds!</h2>
        <p>The page you are looking for has been moved, removed, or never existed.</p>
        <div class="error-actions">
            <a href="../index.html" class="btn btn-primary"><i class="fas fa-home"></i> Go Home</a>
            <button class="btn btn-outline" onclick="showToast('Search triggered!', 'success')"><i class="fas fa-search"></i> Search</button>
        </div>
    </div>
    <button id="backToTopBtn" aria-label="Back to top" title="Go to top"><i class="fas fa-arrow-up"></i></button>
    <script src="../js/script.js"></script>
</body>
</html>
