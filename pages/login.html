<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportivo - Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-image" style="background-image: url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=1200&auto=format&fit=crop');">
            <div class="auth-overlay">
                <h2>Welcome Back!</h2>
                <p>Gear up and conquer your next challenge.</p>
            </div>
        </div>
        <div class="auth-form-wrapper">
            <a href="../index.html" class="auth-logo">Sportivo</a>
            <h3>Sign in to your account</h3>
            <form class="auth-form" onsubmit="event.preventDefault(); alert('Login Successful!');">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="••••••••">
                        <i class="fas fa-eye-slash toggle-password" onclick="togglePassword('password', this)"></i>
                    </div>
                </div>
                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-pwd">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Log In</button>
                <div class="auth-switch">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        function togglePassword(id, icon) {
            const el = document.getElementById(id);
            if(el.type === 'password') {
                el.type = 'text';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                el.type = 'password';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            }
        }
    </script>
    <button id="backToTopBtn" aria-label="Back to top" title="Go to top"><i class="fas fa-arrow-up"></i></button>
</body>
</html>
