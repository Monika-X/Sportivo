<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportivo - Sign Up</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-controls">
        <button id="theme-toggle" aria-label="Toggle Theme" title="Toggle Theme"><i class="fas fa-moon"></i></button>
        <button id="rtl-toggle" aria-label="Toggle RTL" title="Toggle RTL" style="font-weight: 700; font-size: 0.9rem;">RTL</button>
    </div>
    <div class="auth-container reverse">

        <div class="auth-form-wrapper">
            <a href="../index.html" class="auth-logo">Sportivo</a>
            <h3>Create your account</h3>
            <form class="auth-form" onsubmit="event.preventDefault(); validateForm();">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="••••••••" onkeyup="checkStrength()">
                        <i class="fas fa-eye-slash toggle-password" onclick="togglePassword('password', this)"></i>
                    </div>
                    <div class="strength-bar"><div id="strength-fill"></div></div>
                    <small id="strength-text"></small>
                </div>
                <div class="form-group">
                    <label for="confirm">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm" required placeholder="••••••••">
                        <i class="fas fa-eye-slash toggle-password" onclick="togglePassword('confirm', this)"></i>
                    </div>
                    <small id="error-msg" style="color:red; display:none; margin-top:5px;">Passwords do not match!</small>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
                <div class="auth-switch">
                    Already have an account? <a href="login.html">Log In</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        function togglePassword(id, icon) {
            const el = document.getElementById(id);
            if(el.type === 'password') {
                el.type = 'text';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                el.type = 'password';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            }
        }
        function checkStrength() {
            const val = document.getElementById('password').value;
            const fill = document.getElementById('strength-fill');
            const text = document.getElementById('strength-text');
            if(val.length === 0) { fill.style.width = '0%'; text.innerText = ''; return; }
            if(val.length < 5) { fill.style.width = '30%'; fill.style.background = 'red'; text.innerText = 'Weak'; }
            else if(val.length < 8) { fill.style.width = '60%'; fill.style.background = 'orange'; text.innerText = 'Medium'; }
            else { fill.style.width = '100%'; fill.style.background = 'green'; text.innerText = 'Strong'; }
        }
        function validateForm() {
            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('confirm').value;
            const err = document.getElementById('error-msg');
            if(p1 !== p2) {
                err.style.display = 'block';
            } else {
                err.style.display = 'none';
                if(window.showToast) {
                    window.showToast('Account Created Successfully! Redirecting to Home...', 'success');
                }
                document.querySelector('.auth-form').reset();
                const fill = document.getElementById('strength-fill');
                const text = document.getElementById('strength-text');
                if(fill) fill.style.width = '0%';
                if(text) text.innerText = '';

                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1500);
            }
        }
    </script>
    <script src="../js/script.js"></script>
    <button id="backToTopBtn" aria-label="Back to top" title="Go to top"><i class="fas fa-arrow-up"></i></button>
</body>
</html>
